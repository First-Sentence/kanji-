<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>漢字トレーナー</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Hina+Mincho&display=swap");
:root{--bg:#f5f6f8;--panel:#fff;--text:#18212f;--muted:#667085;--line:#dce1e8;--accent:#10a879;--accent2:#e7f7f1;--danger:#d94848;--shadow:0 10px 30px #18212f0a}
[data-theme=dark]{--bg:#11151c;--panel:#1b222d;--text:#f1f4f8;--muted:#a4adba;--line:#333e4c;--accent:#45d6a5;--accent2:#203b33;--danger:#ff7777;--shadow:0 10px 30px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "Hina Mincho",serif}
button,input,textarea,select{font:inherit}button{border:0;cursor:pointer;border-radius:13px;padding:11px 15px;background:var(--accent);color:white;font-weight:700}button.secondary{background:var(--panel);color:var(--text);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--muted);padding:8px}button.danger{background:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:1000px;margin:auto;padding:22px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-weight:850;font-size:21px;letter-spacing:.015em}.brand span{color:var(--accent)}.top-actions{display:flex;gap:8px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.muted{color:var(--muted)}.small{font-size:13px}.heading{font-size:26px;letter-spacing:.015em;margin:0 0 5px}.section{margin:24px 0 10px;font-size:18px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.pill{display:inline-flex;border-radius:99px;padding:4px 10px;background:var(--accent2);color:var(--accent);font-size:12px;font-weight:700}.set-card{display:flex;justify-content:space-between;gap:14px;align-items:center}.set-card+.set-card{margin-top:10px}.set-actions{display:flex;gap:6px;flex-wrap:wrap}.set-actions button{padding:8px 11px;font-size:13px}.input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;padding:11px 12px;outline:none}.input:focus{border-color:var(--accent)}label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.question-card{padding:18px}.question-text{font-size:20px;font-weight:700;margin:8px 0}.canvas-wrap{margin-top:14px;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;touch-action:none;position:relative}.canvas-wrap:after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#dce3ed 1px,transparent 1px),linear-gradient(90deg,#dce3ed 1px,transparent 1px);background-size:50% 50%;opacity:.65}.canvas-wrap canvas{display:block;width:100%;height:clamp(240px,45vh,420px);touch-action:none;position:relative;z-index:1}.canvas-hint{position:absolute;bottom:9px;right:12px;color:#98a2b3;font-size:12px;z-index:2;pointer-events:none}.result{margin-top:14px;border-radius:14px;padding:15px;background:var(--accent2)}.result.correct{background:#e8f7ed;color:#176b38}.result.wrong{background:#fff0ee;color:#a32c24}[data-theme=dark] .result.correct{background:#203a2c;color:#92e1ac}[data-theme=dark] .result.wrong{background:#432b2b;color:#ffaaa2}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}.hidden{display:none!important}.modal-back{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{max-width:650px;width:100%;max-height:90vh;overflow:auto}.notice{border:1px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted);font-size:13px}.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0}.progress div{height:100%;background:var(--accent);width:0}.tag{font-size:12px;color:var(--muted)}.list{display:grid;gap:10px}.empty{text-align:center;padding:32px 16px;color:var(--muted)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#18212f;color:white;padding:10px 16px;border-radius:99px;z-index:20;box-shadow:var(--shadow)}
@media(max-width:650px){.wrap{padding:14px 12px 50px}.panel{padding:15px;border-radius:16px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.set-card{align-items:flex-start;flex-direction:column}.set-actions{width:100%}.set-actions button{flex:1}.heading{font-size:23px}.top{margin-bottom:18px}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand">漢字<span>トレーナー</span></div><div class="top-actions"><button class="secondary" id="themeBtn" aria-label="テーマ切替">◐</button></div></header>
<main id="app"></main></div>
<script>
const KEY="kanjiTrainerSets_v1", MISS="kanjiTrainerMiss_v1";
let sets=load(KEY,[]), misses=load(MISS,{}), theme=localStorage.getItem("kanjiTheme")||"light", current=null, quiz=null, editing=null, imported=null;
document.documentElement.dataset.theme=theme;
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}
function save(){localStorage.setItem(KEY,JSON.stringify(sets));localStorage.setItem(MISS,JSON.stringify(misses))}
function uid(){return Math.random().toString(36).slice(2,9)}
function date(){return new Date().toLocaleString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){let t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function sample(){return {name:"サンプル・定期テスト",items:[
{subject:"国語",reading:"しんちょう",sentence:"彼は状況をよく考えて、しんちょうに行動した。",answer:"慎重"},
{subject:"社会",reading:"けんり",sentence:"すべての人に基本的なけんりが保障されている。",answer:"権利"},
{subject:"理科",reading:"たいせき",sentence:"物体のたいせきを測定する。",answer:"体積"},
{subject:"国語",reading:"きょうりょく",sentence:"友達ときょうりょくして課題を解決する。",answer:"協力"},
{subject:"社会",reading:"せいじ",sentence:"国のせいじの仕組みを学ぶ。",answer:"政治"},
{subject:"理科",reading:"じょうはつ",sentence:"水が熱によってじょうはつする。",answer:"蒸発"},
{subject:"国語",reading:"せいかく",sentence:"説明をせいかくに理解する。",answer:"正確"},
{subject:"社会",reading:"さんぎょう",sentence:"地域のさんぎょうについて調べた。",answer:"産業"},
{subject:"理科",reading:"こんごう",sentence:"二つ以上の物質をこんごうする。",answer:"混合"},
{subject:"国語",reading:"かんしょう",sentence:"美術館で絵をかんしょうする。",answer:"鑑賞"}]}}
if(!sets.length){let s=sample();s.id=uid();s.created=s.updated=date();sets=[s];save()}
function renderHome(){app.innerHTML=`<section class="panel"><div class="row between"><div><h1 class="heading">学習セット</h1><div class="muted">書いて覚える、定期テスト対策。</div></div><button id="newSet">＋ 新しいセット</button></div></section>
<div class="row between"><h2 class="section">保存したセット <span class="muted small">(${sets.length})</span></h2><button class="secondary" id="reviewBtn">苦手を復習</button></div>
<div class="list" id="setList">${sets.length?sets.map(s=>`<div class="panel set-card"><div><strong>${esc(s.name)}</strong><div class="muted small">${s.items.length}問 · 更新 ${esc(s.updated||"—")}</div></div><div class="set-actions"><button data-do="solve" data-id="${s.id}">▶ 解く</button><button class="secondary" data-do="edit" data-id="${s.id}">✏ 編集</button><button class="secondary" data-do="share" data-id="${s.id}">🔗 共有</button><button class="secondary" data-do="delete" data-id="${s.id}">🗑</button></div></div>`).join(""):`<div class="panel empty">セットがありません。新しく作成しましょう。</div>`}</div>
<section class="panel" style="margin-top:16px"><div class="row between"><div><strong>苦手ノート</strong><div class="muted small">間違えた漢字は自動で記録されます。</div></div><span class="pill">${Object.keys(misses).length}字</span></div><div id="missList" class="small" style="margin-top:10px">${Object.entries(misses).length?Object.entries(misses).map(([k,v])=>`<span class="pill" style="margin:3px">${esc(k)} · ${v}</span>`).join(""):"まだ記録はありません。"}</div></section>
<div class="notice" style="margin-top:14px">手書き判定について：この1ファイル版では、ブラウザ内の漢字認識機能がある場合に利用し、非対応環境では自己判定モードになります。外部AI/Vision APIの利用にはAPIキーやサーバー等が必要で、キーをHTMLに埋め込むのは危険です。</div>`;
}
function openEditor(s){editing=s?JSON.parse(JSON.stringify(s)): {id:uid(),name:"",items:[],created:date(),updated:date()};renderEditor()}
function renderEditor(){app.innerHTML=`<section class="panel"><div class="row between"><div><h1 class="heading">${editing.name?"セット編集":"セット作成"}</h1><div class="muted">問題を追加・編集できます</div></div><button class="secondary" id="back">← 戻る</button></div>
<div style="margin-top:16px"><label>セット名</label><input class="input" id="setName" value="${esc(editing.name)}" placeholder="例：2学期中間テスト"></div><h2 class="section">問題一覧 (${editing.items.length})</h2><div class="list" id="items">${editing.items.map((q,i)=>itemCard(q,i)).join("")}</div>
<button class="secondary" style="margin-top:12px" id="addItem">＋ 問題を追加</button><div class="toolbar"><button id="saveSet">保存する</button><button class="secondary" id="cancel">キャンセル</button></div></section>`}
function itemCard(q,i){return `<div class="panel" style="padding:14px"><div class="row between"><strong>問題 ${i+1}</strong><button class="ghost danger" data-remove="${i}">削除</button></div><div class="formgrid" style="margin-top:10px"><div><label>教科</label><input class="input" data-field="subject" data-i="${i}" value="${esc(q.subject)}" placeholder="国語"></div><div><label>読み</label><input class="input" data-field="reading" data-i="${i}" value="${esc(q.reading)}" placeholder="よみ"></div><div class="full"><label>例文</label><input class="input" data-field="sentence" data-i="${i}" value="${esc(q.sentence)}" placeholder="例文"></div><div class="full"><label>正答（漢字）</label><input class="input" data-field="answer" data-i="${i}" value="${esc(q.answer)}" placeholder="漢字"></div></div></div>`}
function saveEditor(){editing.name=document.getElementById("setName").value.trim()||"名称未設定";editing.updated=date();if(!editing.created)editing.created=date();if(!editing.items.length){toast("問題を1問以上追加してください");return}let ix=sets.findIndex(s=>s.id===editing.id);if(ix>=0)sets[ix]=editing;else sets.unshift(editing);save();renderHome();toast("保存しました")}
function beginQuiz(s,review=false){let items=review?Object.keys(misses).map(a=>s.items.find(q=>q.answer===a)).filter(Boolean):s.items.slice();if(review&&!items.length){toast("このセットに復習対象はありません");return}current=s;quiz={items:shuffle(items),idx:0,results:[],review,limit:items.length};renderQuiz()}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderQuiz(){let q=quiz.items[quiz.idx];if(!q){renderSummary();return}app.innerHTML=`<section class="panel question-card"><div class="row between"><button class="secondary" id="quit">← 中断</button><span class="pill">${quiz.review?"苦手復習":esc(current.name)}</span></div><div class="muted small" style="margin-top:15px">${quiz.idx+1} / ${quiz.items.length} 問 · ${esc(q.subject||"")}</div><div class="progress"><div style="width:${quiz.idx/quiz.items.length*100}%"></div></div><div class="question-text">${esc(q.reading)} <span class="muted" style="font-size:14px">（読み）</span></div><div>${esc(q.sentence)}</div>
<div class="canvas-wrap"><canvas id="draw"></canvas><span class="canvas-hint">ここに漢字を書いてください</span></div><div class="toolbar"><button class="secondary" id="clear">消去</button><button id="answer">回答する</button></div><div class="result hidden" id="result"></div><div class="toolbar hidden" id="nextbar"><button id="next">次の問題 →</button></div></section>
<div class="notice" style="margin-top:12px">認識結果はブラウザの対応状況によります。認識に失敗したら「正解を確認」から自己判定できます。</div>`;
setupCanvas();document.getElementById("quit").onclick=renderHome;document.getElementById("clear").onclick=clearCanvas;document.getElementById("answer").onclick=judge;document.getElementById("next").onclick=()=>{quiz.idx++;renderQuiz()};
}
let canvas,ctx,drawing=false,strokes=[],stroke=[];
function setupCanvas(){canvas=document.getElementById("draw");let rect=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);ctx.lineWidth=7;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#18212f";
canvas.addEventListener("pointerdown",e=>{e.preventDefault();drawing=true;stroke=[];canvas.setPointerCapture(e.pointerId);let p=pos(e);stroke.push(p);ctx.beginPath();ctx.moveTo(p.x,p.y)});
canvas.addEventListener("pointermove",e=>{if(!drawing)return;e.preventDefault();let p=pos(e);stroke.push(p);ctx.lineTo(p.x,p.y);ctx.stroke()});
["pointerup","pointercancel"].forEach(ev=>canvas.addEventListener(ev,e=>{if(drawing){drawing=false;strokes.push(stroke)}}))}
function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);strokes=[]}
async function judge(){let q=quiz.items[quiz.idx],result=document.getElementById("result");let recognized=null;
try{if("TextDetector" in window){let detector=new TextDetector();let data=canvas.toDataURL();let blob=await (await fetch(data)).blob();let bitmap=await createImageBitmap(blob);let detections=await detector.detect(bitmap);recognized=detections.map(d=>d.rawValue).join("");}}catch{}
result.classList.remove("hidden","correct","wrong");let correct=recognized&&recognized.replace(/\s/g,"")===q.answer.replace(/\s/g,"");
if(recognized){result.classList.add(correct?"correct":"wrong");result.innerHTML=`<strong>${correct?"正解！":"不正解"}</strong><div>認識：${esc(recognized)}　正答：${esc(q.answer)}</div>`}
else {result.innerHTML=`<strong>正答を確認</strong><div>正答：<b style="font-size:22px">${esc(q.answer)}</b></div><div class="small">自動認識が利用できないため、自己判定してください。</div><div class="row" style="margin-top:8px"><button id="selfCorrect">正解</button><button class="danger" id="selfWrong">不正解</button></div>`;document.getElementById("selfCorrect").onclick=()=>record(true);document.getElementById("selfWrong").onclick=()=>record(false);document.getElementById("nextbar").classList.add("hidden");}
if(recognized)record(correct);
}
function record(correct){let q=quiz.items[quiz.idx];quiz.results[quiz.idx]=correct;if(!correct)misses[q.answer]=(misses[q.answer]||0)+1;else if(misses[q.answer]){misses[q.answer]--;if(!misses[q.answer])delete misses[q.answer]}save();document.getElementById("nextbar").classList.remove("hidden");document.getElementById("answer").disabled=true;document.getElementById("clear").disabled=true}
function renderSummary(){let n=quiz.results.filter(Boolean).length,total=quiz.items.length;app.innerHTML=`<section class="panel"><h1 class="heading">おつかれさま！</h1><p>今回の結果：<strong style="font-size:28px">${n} / ${total}</strong> 問正解</p><div class="progress"><div style="width:${n/total*100}%"></div></div><div class="row"><button id="again">もう一度</button><button class="secondary" id="home">セット一覧へ</button></div><h2 class="section">間違えた問題</h2>${quiz.items.filter((q,i)=>!quiz.results[i]).map(q=>`<div class="panel" style="margin:8px 0"><strong>${esc(q.answer)}</strong> <span class="muted">${esc(q.reading)}</span><div class="small">${esc(q.sentence)}</div></div>`).join("")||"<p class=muted>全問正解！</p>"}</section>`;document.getElementById("again").onclick=()=>beginQuiz(current,quiz.review);document.getElementById("home").onclick=renderHome}
function encodeSet(s){let json=JSON.stringify({name:s.name,items:s.items});let b64=btoa(unescape(encodeURIComponent(json)));return location.origin+location.pathname+"#set="+encodeURIComponent(b64)}
function importHash(){if(location.hash.startsWith("#set=")){try{let b=decodeURIComponent(location.hash.slice(5));let json=decodeURIComponent(escape(atob(b)));imported=JSON.parse(json);renderImport()}catch{toast("共有URLの読み込みに失敗しました");location.hash=""}}}
function renderImport(){app.innerHTML=`<section class="panel"><span class="pill">共有された問題セット</span><h1 class="heading" style="margin-top:12px">${esc(imported.name||"共有セット")}</h1><p class="muted">${imported.items?.length||0}問 · URLから読み込み</p><div class="notice">このセットは共有URL内のデータです。元の作成者が編集・削除しても、この画面のデータには影響しません。</div><div class="row" style="margin-top:16px"><button id="solveShared">この問題セットを解く</button><button class="secondary" id="saveShared">自分の問題セットに保存</button></div><button class="ghost" id="backHome" style="margin-top:10px">自分のセット一覧へ</button></section>`;document.getElementById("solveShared").onclick=()=>beginQuiz({name:imported.name,items:imported.items},false);document.getElementById("saveShared").onclick=()=>{let s={id:uid(),name:imported.name||"共有セット",items:imported.items,created:date(),updated:date()};sets.unshift(s);save();toast("保存しました");renderHome()};document.getElementById("backHome").onclick=()=>{location.hash="";imported=null;renderHome()}}
function share(s){let url=encodeSet(s);showModal(`<h2 class="section">共有URLを作成</h2><p class="muted">問題データをURLに埋め込んでいます（サーバー不要）。</p><textarea class="input" id="shareUrl" rows="4" readonly>${esc(url)}</textarea><div class="row" style="margin-top:12px"><button id="copyUrl">URLをコピー</button><button class="secondary" id="closeModal">閉じる</button></div><div class="notice" style="margin-top:12px">問題数が多い場合、URLが長くなることがあります。URLを受け取った人は解答または自分のセットに保存できます。</div>`);document.getElementById("copyUrl").onclick=async()=>{try{await navigator.clipboard.writeText(url);toast("コピーしました")}catch{document.getElementById("shareUrl").select();toast("URLを選択してコピーしてください")}}}
function showModal(content){let m=document.createElement("div");m.className="modal-back";m.innerHTML=`<div class="panel modal">${content}</div>`;document.body.append(m);m.onclick=e=>{if(e.target===m)m.remove()};document.getElementById("closeModal").onclick=()=>m.remove()}
app.addEventListener("click",e=>{let b=e.target.closest("[data-do]");if(!b)return;let s=sets.find(x=>x.id===b.dataset.id);if(!s)return;switch(b.dataset.do){case"solve":showModal(`<h2 class="section">出題数を選択</h2><p>${esc(s.name)} · ${s.items.length}問</p><select class="input" id="count"><option value="10">10問</option><option value="30">30問</option><option value="50">50問</option><option value="100">100問</option><option value="200">200問</option><option value="all">登録されている全問</option></select><div class="row" style="margin-top:12px"><button id="start">開始（ランダム）</button><button class="secondary" id="closeModal">戻る</button></div>`);document.getElementById("start").onclick=()=>{let val=document.getElementById("count").value;document.querySelector(".modal-back").remove();let n=val==="all"?s.items.length:Math.min(+val,s.items.length);beginQuiz(s,false);quiz.items=shuffle(s.items).slice(0,n);quiz.limit=n;renderQuiz()};break;case"edit":openEditor(s);break;case"share":share(s);break;case"delete":if(confirm(`「${s.name}」を削除しますか？`)){sets=sets.filter(x=>x.id!==s.id);save();renderHome()}break}});
app.addEventListener("click",e=>{if(e.target.id==="newSet")openEditor();if(e.target.id==="reviewBtn"){if(sets.length)beginQuiz(sets[0],true)}if(e.target.id==="back"||e.target.id==="cancel")renderHome();if(e.target.id==="addItem"){editing.items.push({subject:"",reading:"",sentence:"",answer:""});renderEditor()}if(e.target.id==="saveSet")saveEditor();if(e.target.dataset.remove!==undefined){editing.items.splice(+e.target.dataset.remove,1);renderEditor()}});
app.addEventListener("input",e=>{if(e.target.dataset.field){let i=+e.target.dataset.i;editing.items[i][e.target.dataset.field]=e.target.value}});
document.getElementById("themeBtn").onclick=()=>{theme=theme==="light"?"dark":"light";document.documentElement.dataset.theme=theme;localStorage.setItem("kanjiTheme",theme)};
if(location.hash)importHash();else renderHome();
</script></body></html>
